name: iOS Build Check

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use HTTPS instead of SSH for GitHub (submodules have no CI key)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Build SysInfoCommand
        run: |
          xcodebuild build \
            -scheme SysInfoCommand \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build SSHClientCommand
        run: |
          xcodebuild build \
            -scheme SSHClientCommand \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build GitCommand
        run: |
          xcodebuild build \
            -scheme GitCommand \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build LinuxVM
        run: |
          xcodebuild build \
            -scheme LinuxVM \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build TermuxSandboxApp
        run: |
          xcodebuild build \
            -scheme TermuxSandboxApp \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  # Installable app: the package above + QEMU frameworks from UTM's release
  # IPAs, wrapped in the XcodeGen project at App/project.yml. Produces an
  # unsigned (ldid fake-signed, entitlements embedded) IPA for SideStore /
  # AltStore / TrollStore, which re-sign it for the device.
  package-ipa:
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Use HTTPS instead of SSH for GitHub (submodules have no CI key)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Fetch QEMU frameworks (UTM release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Scripts/fetch-qemu-frameworks.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec App/project.yml

      - name: Build app
        run: |
          xcodebuild build \
            -project App/TermuxSandbox.xcodeproj \
            -scheme TermuxSandbox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/TermuxSandbox.app
          ls "$APP" "$APP/Frameworks"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          for fw in ipa/Payload/TermuxSandbox.app/Frameworks/*.framework; do
            ldid -S "$fw" || { echo "::error::ldid failed on $fw"; exit 1; }
          done
          ldid -SApp/App.entitlements -Idev.me7ko.termuxsandbox ipa/Payload/TermuxSandbox.app/TermuxSandbox
          (cd ipa && zip -qry ../UbuntuTerminal.ipa Payload)
          ls -lh UbuntuTerminal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UbuntuTerminal-ipa
          path: UbuntuTerminal.ipa
