name: iOS Build Check

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      - name: Build SysInfoCommand
        run: |
          xcodebuild build \
            -scheme SysInfoCommand \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build SSHClientCommand
        run: |
          xcodebuild build \
            -scheme SSHClientCommand \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build TermuxSandboxApp
        run: |
          xcodebuild build \
            -scheme TermuxSandboxApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
