# XcodeGen spec for the installable iOS app:  brew install xcodegen
#   ./Scripts/fetch-qemu-frameworks.sh     # -> Vendor/QEMU (needs gh)
#   xcodegen generate --spec App/project.yml
#   open App/TermuxSandbox.xcodeproj
# CI does the same and uploads an unsigned .ipa for SideStore/AltStore —
# see .github/workflows/ios-build.yml and Docs/STATUS.md.
name: TermuxSandbox
options:
  bundleIdPrefix: dev.me7ko
  deploymentTarget:
    iOS: "17.0"
packages:
  TermuxSandbox:
    path: ..
targets:
  TermuxSandbox:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: TermuxSandbox
        product: TermuxSandboxApp
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Ubuntu Terminal
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.me7ko.termuxsandbox
        DEVELOPMENT_TEAM: FUW9HQV9D7
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # The embed script rsyncs Vendor/QEMU into the .app; Xcode 15+ script
        # sandboxing blocks that since the frameworks are not declared outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Embed QEMU frameworks
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/../Vendor/QEMU/Frameworks"
          if [ ! -d "$SRC" ]; then
            echo "warning: Vendor/QEMU missing — run Scripts/fetch-qemu-frameworks.sh; the Ubuntu tab will not be able to boot."
            exit 0
          fi
          DEST="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$DEST"
          # Re-copying/re-signing on an incremental build changes the binaries
          # after Xcode has already sealed the .app (it doesn't re-sign when
          # nothing else changed) -> "sealed resource is missing or invalid".
          STAMP="${DERIVED_FILE_DIR}/qemu-embedded-${EXPANDED_CODE_SIGN_IDENTITY:-unsigned}"
          if [ -f "$STAMP" ] && [ -d "$DEST/qemu-aarch64-softmmu.framework" ] && [ -z "$(find "$SRC" -newer "$STAMP" -print -quit)" ]; then
            exit 0
          fi
          mkdir -p "${DERIVED_FILE_DIR}"; rm -f "${DERIVED_FILE_DIR}"/qemu-embedded-*
          rsync -a --delete-excluded "$SRC/" "$DEST/"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            for fw in "$SRC"/*.framework; do
              /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/$(basename "$fw")"
            done
          fi
          touch "$STAMP"
schemes:
  TermuxSandbox:
    build:
      targets:
        TermuxSandbox: all
    run:
      config: Debug
    archive:
      config: Release
